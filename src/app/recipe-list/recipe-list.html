<main class="recipe">
  <app-recipe-detail [recipe]="activeRecipe()"></app-recipe-detail>
  <section>
    <input type="text" [(ngModel)]="searchTerm" />
  </section >
  <div class="switch">
    @for(recipe of filteredReceipes(); track $index){
      <button (click)="select($index)">{{recipe.name}}</button>
    }
  </div>
</main>
